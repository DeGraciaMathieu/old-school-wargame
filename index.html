<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Terra Incognita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">

<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>Terra Incognita</h1>
      <p>Bleus contre Rouges · une carte nouvelle à chaque partie</p>
    </div>
    <div class="track" id="track" aria-label="Piste des tours"></div>
    <div class="tools">
      <button class="btn ghost tog" id="btnSound" type="button" aria-pressed="true">Son</button>
      <button class="btn ghost tog" id="btnAmb" type="button" aria-pressed="true">Ambiance</button>
      <button class="btn ghost" id="btnRules" type="button">Règles</button>
      <button class="btn ghost" id="btnNew" type="button">Nouvelle partie</button>
    </div>
  </header>
  <main class="board">
    <section class="mapwrap" aria-label="Carte">
      <div class="mapscroll" id="mapscroll"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="mapscore" id="mapscore" aria-live="polite"></div>
      <div class="mapact" id="mapact" hidden></div>
      <div class="zoom"><button type="button" id="zin" aria-label="Zoomer">+</button><button type="button" id="zout" aria-label="Dézoomer">−</button></div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>
</div>
<div class="hall" id="hall" hidden></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script type="module" src="src/main.js"></script>

</body></html>
